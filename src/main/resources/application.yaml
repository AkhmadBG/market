spring:
  application:
    name: market
  datasource:
    url: jdbc:postgresql://localhost:5431/market
    username: market
    password: market
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

