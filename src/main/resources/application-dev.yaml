spring:
  datasource:
      url: jdbc:postgresql://localhost:5431/market
      username: market
      password: market
      driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml