services:

  postgres:
    image: postgres:16.1
    container_name: market_postgres_db
    restart: always
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    volumes:
      - market:/var/lib/postgresql/data
    ports:
      - "5431:5432"

  redis:
    image: redis:7
    container_name: market_redis_cache
    restart: always
    volumes:
      - redis:/var/lib/redis/data
    ports:
      - "6379:6379"

volumes:
  market:
  redis: