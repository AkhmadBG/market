services:

  postgres-payment:
    image: postgres:16.1
    container_name: payment_postgres_db
    restart: always
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    volumes:
      - payment:/var/lib/postgresql/data
    ports:
      - "5430:5432"

  postgres-market:
    image: postgres:16.1
    container_name: market_postgres_db
    restart: always
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    volumes:
      - market:/var/lib/postgresql/data
    ports:
      - "5431:5432"

  redis:
    image: redis:7
    container_name: market_redis_cache
    restart: always
    volumes:
      - redis:/var/lib/redis/data
    ports:
      - "6379:6379"

  authorization-server:
    build: ./authorization-server
    container_name: market_authorization_server
    ports:
      - "8082:8082"

  payment:
    build: ./payment
    container_name: market_payment
    depends_on:
      - postgres-payment
    ports:
      - "8081:8081"

  storefront:
    build: ./storefront
    container_name: market_storefront
    depends_on:
      - postgres-market
      - redis
    ports:
      - "8080:8080"

volumes:
  market:
  redis:
  payment: